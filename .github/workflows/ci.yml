name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lei
          POSTGRES_PASSWORD: lei
          POSTGRES_DB: lei_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lei" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lei:lei@localhost:5432/lei_teste
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pergunte-a-lei .
